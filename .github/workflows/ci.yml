name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: 1. Validate Registry & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate Registry Structure & Metadata
        run: npm run validate

      - name: Run Test Suite (CLI, Extension Logic, Links, Updater)
        run: npm test

  package-extension:
    name: 2. Package Extension VSIX
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Package Extension VSIX Bundle
        run: npm run package:extension

      - name: Verify VSIX Package Artifact
        run: |
          if ls tools/ide-extension/*.vsix 1> /dev/null 2>&1; then
            echo "✔ VSIX package successfully generated:"
            ls -lh tools/ide-extension/*.vsix
          else
            echo "❌ VSIX package not found!"
            exit 1
          fi

      - name: Upload VSIX Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-agents-hub-vsix
          path: tools/ide-extension/*.vsix
          retention-days: 30
